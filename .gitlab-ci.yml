# The release pipeline of smspp-project triggers this one with the version of
# the new tag in SMSPP_VERSION: the smspp port is updated to it and pushed.
# The job pushes with its own CI_JOB_TOKEN, as the user who pushed the tag, so
# the project allows Git pushes with the job token (Settings > CI/CD > Job
# token permissions).

update_smspp:
  image: alpine
  rules:
    - if: $SMSPP_VERSION
  before_script:
    - apk add --no-cache git python3 curl
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
  script:
    - git fetch origin develop
    - git checkout -B develop origin/develop
    - ./update-smspp-port "$SMSPP_VERSION"
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" HEAD:develop HEAD:master
